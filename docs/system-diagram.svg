<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mizmentor system diagram: what happens when you send one message</title>

  <defs>
    <marker id="arrowFixed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#003262"/>
    </marker>
    <marker id="arrowVar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/>
    </marker>
    <marker id="arrowIn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78716C"/>
    </marker>
    <marker id="arrowNo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B91C1C"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#FBFAF8"/>

  <!-- ===== Title ===== -->
  <text x="40" y="54" font-size="36" font-weight="700" fill="#1C1917">Mizmentor</text>
  <text x="235" y="54" font-size="26" fill="#57534E">what happens when you send one message</text>

  <!-- ===== Legend ===== -->
  <g>
    <rect x="40" y="76" width="26" height="26" rx="5" fill="#E8EEF4" stroke="#003262" stroke-width="2.5"/>
    <text x="76" y="95" font-size="19" font-weight="600" fill="#003262">Always the same</text>
    <text x="246" y="95" font-size="17" fill="#57534E">— plain code, no judgement</text>

    <rect x="540" y="76" width="26" height="26" rx="5" fill="#FDF3E3" stroke="#B45309" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text x="576" y="95" font-size="19" font-weight="600" fill="#9A3412">Different every time</text>
    <text x="782" y="95" font-size="17" fill="#57534E">— written by the model</text>

    <rect x="1030" y="76" width="26" height="26" rx="5" fill="#ECFDF5" stroke="#047857" stroke-width="2.5"/>
    <text x="1066" y="95" font-size="19" font-weight="600" fill="#065F46">Information enters</text>
  </g>

  <!-- ================= ROW 1: the outward journey ================= -->

  <!-- A. Entry points -->
  <rect x="40" y="140" width="268" height="330" rx="12" fill="#ECFDF5" stroke="#047857" stroke-width="3"/>
  <text x="62" y="174" font-size="20" font-weight="700" fill="#065F46">INFORMATION ENTERS</text>
  <line x1="62" y1="190" x2="286" y2="190" stroke="#A7F3D0" stroke-width="2"/>

  <text x="62" y="222" font-size="20" font-weight="600" fill="#064E3B">Your message</text>
  <text x="62" y="246" font-size="17" fill="#047857">every turn</text>

  <text x="62" y="286" font-size="20" font-weight="600" fill="#064E3B">Saved session</text>
  <text x="62" y="310" font-size="17" fill="#047857">browser storage, on load</text>

  <line x1="62" y1="334" x2="286" y2="334" stroke="#A7F3D0" stroke-width="2" stroke-dasharray="5 4"/>

  <text x="62" y="368" font-size="20" font-weight="600" fill="#064E3B">knowledge/*.md</text>
  <text x="62" y="392" font-size="17" fill="#047857">baked in when built</text>

  <text x="62" y="432" font-size="20" font-weight="600" fill="#064E3B">API key (.env)</text>
  <text x="62" y="456" font-size="17" fill="#047857">read once at startup</text>

  <!-- B. Browser -->
  <rect x="348" y="140" width="252" height="330" rx="12" fill="#E8EEF4" stroke="#003262" stroke-width="3"/>
  <text x="370" y="174" font-size="20" font-weight="700" fill="#003262">YOUR BROWSER</text>
  <line x1="370" y1="190" x2="578" y2="190" stroke="#B6C7D6" stroke-width="2"/>
  <text x="370" y="226" font-size="18" fill="#1C1917">Sends, as one</text>
  <text x="370" y="250" font-size="18" fill="#1C1917">request:</text>
  <text x="370" y="292" font-size="19" font-weight="600" fill="#003262">• the conversation</text>
  <text x="370" y="326" font-size="19" font-weight="600" fill="#003262">• session summary</text>
  <text x="370" y="360" font-size="19" font-weight="600" fill="#003262">• current stage</text>
  <text x="370" y="420" font-size="16" fill="#57534E">Nothing else about you</text>
  <text x="370" y="442" font-size="16" fill="#57534E">leaves this box.</text>

  <!-- C. Server -->
  <rect x="640" y="140" width="330" height="330" rx="12" fill="#E8EEF4" stroke="#003262" stroke-width="3"/>
  <text x="662" y="174" font-size="20" font-weight="700" fill="#003262">SERVER</text>
  <line x1="662" y1="190" x2="948" y2="190" stroke="#B6C7D6" stroke-width="2"/>

  <text x="662" y="222" font-size="19" font-weight="600" fill="#1C1917">1 — Count the replies</text>
  <text x="662" y="246" font-size="16" fill="#57534E">pure arithmetic</text>

  <text x="662" y="286" font-size="19" font-weight="600" fill="#1C1917">2 — Pick the instruction</text>
  <text x="662" y="308" font-size="16" fill="#57534E">by reply number:</text>

  <rect x="662" y="320" width="286" height="34" rx="6" fill="#FFFFFF" stroke="#7E98B0" stroke-width="1.6"/>
  <text x="676" y="343" font-size="17" fill="#003262"><tspan font-weight="700">reply 1</tspan>  ask what you want</text>

  <rect x="662" y="360" width="286" height="34" rx="6" fill="#FFFFFF" stroke="#7E98B0" stroke-width="1.6"/>
  <text x="676" y="383" font-size="17" fill="#003262"><tspan font-weight="700">reply 2</tspan>  one check, if needed</text>

  <rect x="662" y="400" width="286" height="34" rx="6" fill="#FFFFFF" stroke="#7E98B0" stroke-width="1.6"/>
  <text x="676" y="423" font-size="17" fill="#003262"><tspan font-weight="700">reply 3+</tspan>  a point is required</text>

  <text x="662" y="456" font-size="16" fill="#57534E">Same rule every session.</text>

  <!-- D. The payload -->
  <rect x="1010" y="140" width="358" height="330" rx="12" fill="#E8EEF4" stroke="#003262" stroke-width="3"/>
  <text x="1032" y="174" font-size="20" font-weight="700" fill="#003262">SENT TO THE MODEL</text>
  <line x1="1032" y1="190" x2="1346" y2="190" stroke="#B6C7D6" stroke-width="2"/>

  <text x="1032" y="222" font-size="19" font-weight="600" fill="#1C1917">Role card</text>
  <text x="1032" y="252" font-size="19" font-weight="600" fill="#1C1917">+ all 3 knowledge files</text>

  <rect x="1032" y="266" width="314" height="62" rx="7" fill="#FFF8E6" stroke="#B45309" stroke-width="2"/>
  <text x="1046" y="292" font-size="19" font-weight="700" fill="#9A3412">All 88,000 characters,</text>
  <text x="1046" y="316" font-size="19" font-weight="700" fill="#9A3412">every single message</text>

  <text x="1032" y="358" font-size="18" fill="#1C1917">No retrieval step.</text>
  <text x="1032" y="382" font-size="18" fill="#1C1917">Nothing is selected or</text>
  <text x="1032" y="404" font-size="18" fill="#1C1917">looked up as relevant.</text>

  <text x="1032" y="440" font-size="18" fill="#1C1917">+ the conversation</text>
  <text x="1032" y="462" font-size="18" fill="#1C1917">+ this turn's instruction</text>

  <!-- E. Gemini -->
  <rect x="1408" y="140" width="152" height="200" rx="12" fill="#F5F5F4" stroke="#44403C" stroke-width="3"/>
  <text x="1484" y="178" font-size="20" font-weight="700" fill="#1C1917" text-anchor="middle">GEMINI</text>
  <line x1="1428" y1="194" x2="1540" y2="194" stroke="#D6D3D1" stroke-width="2"/>
  <text x="1484" y="224" font-size="16" fill="#57534E" text-anchor="middle">outside</text>
  <text x="1484" y="246" font-size="16" fill="#57534E" text-anchor="middle">this app</text>
  <text x="1484" y="286" font-size="17" font-weight="600" fill="#003262" text-anchor="middle">1 model</text>
  <text x="1484" y="310" font-size="17" font-weight="600" fill="#003262" text-anchor="middle">+ 3 backups</text>

  <!-- Entry arrow: your message + saved session go into the browser -->
  <line x1="312" y1="250" x2="344" y2="250" stroke="#047857" stroke-width="3.5" marker-end="url(#arrowIn)"/>

  <!-- Entry arrow: knowledge + key are already on the SERVER, not the browser -->
  <path d="M 240 474 L 240 496 L 800 496 L 800 478" fill="none" stroke="#047857" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrowIn)"/>
  <text x="826" y="502" font-size="16" font-style="italic" fill="#047857">these two are already on the server</text>

  <!-- Flow arrows row 1 -->
  <line x1="604" y1="300" x2="636" y2="300" stroke="#003262" stroke-width="4" marker-end="url(#arrowFixed)"/>
  <line x1="974" y1="300" x2="1006" y2="300" stroke="#003262" stroke-width="4" marker-end="url(#arrowFixed)"/>
  <line x1="1372" y1="240" x2="1404" y2="240" stroke="#003262" stroke-width="4" marker-end="url(#arrowFixed)"/>

  <!-- ================= Model is NOT given ================= -->
  <rect x="1180" y="520" width="380" height="226" rx="12" fill="#FEF2F2" stroke="#B91C1C" stroke-width="3"/>
  <text x="1202" y="556" font-size="20" font-weight="700" fill="#991B1B">THE MODEL NEVER GETS</text>
  <line x1="1202" y1="572" x2="1538" y2="572" stroke="#FECACA" stroke-width="2"/>
  <text x="1202" y="608" font-size="21" fill="#7F1D1D"><tspan font-weight="700" fill="#B91C1C">×</tspan>  web search</text>
  <text x="1202" y="644" font-size="21" fill="#7F1D1D"><tspan font-weight="700" fill="#B91C1C">×</tspan>  any database</text>
  <text x="1202" y="680" font-size="21" fill="#7F1D1D"><tspan font-weight="700" fill="#B91C1C">×</tspan>  your files or disk</text>
  <text x="1202" y="716" font-size="21" fill="#7F1D1D"><tspan font-weight="700" fill="#B91C1C">×</tspan>  memory of past sessions</text>

  <path d="M 1500 344 L 1500 514" fill="none" stroke="#B91C1C" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrowNo)"/>

  <!-- ================= ROW 2: the return journey ================= -->

  <!-- F. JSON back -->
  <rect x="640" y="520" width="440" height="226" rx="12" fill="#FDF3E3" stroke="#B45309" stroke-width="3" stroke-dasharray="9 5"/>
  <text x="662" y="556" font-size="20" font-weight="700" fill="#9A3412">WHAT COMES BACK</text>
  <line x1="662" y1="572" x2="1058" y2="572" stroke="#F3D5A7" stroke-width="2"/>
  <text x="662" y="604" font-size="18" fill="#57534E">One fixed JSON shape, 8 fields:</text>
  <text x="662" y="640" font-size="20" font-weight="600" fill="#7C2D12">the reply · the stage · your goal</text>
  <text x="662" y="668" font-size="20" font-weight="600" fill="#7C2D12">the reading · the point</text>
  <text x="662" y="696" font-size="20" font-weight="600" fill="#7C2D12">what is missing · your next steps</text>
  <text x="662" y="730" font-size="17" font-style="italic" fill="#9A3412">Shape fixed. Wording new every time.</text>

  <!-- G. Merge -->
  <rect x="348" y="520" width="252" height="226" rx="12" fill="#E8EEF4" stroke="#003262" stroke-width="3"/>
  <text x="370" y="556" font-size="20" font-weight="700" fill="#003262">FOLDED IN</text>
  <line x1="370" y1="572" x2="578" y2="572" stroke="#B6C7D6" stroke-width="2"/>
  <text x="370" y="604" font-size="18" fill="#1C1917">Fixed rules:</text>
  <text x="370" y="640" font-size="18" font-weight="600" fill="#003262">reading, point</text>
  <text x="370" y="662" font-size="17" fill="#57534E">replaced</text>
  <text x="370" y="698" font-size="18" font-weight="600" fill="#003262">your next steps</text>
  <text x="370" y="720" font-size="17" fill="#57534E">added up, never dropped</text>

  <!-- H. What you see -->
  <rect x="40" y="520" width="268" height="226" rx="12" fill="#FDF3E3" stroke="#B45309" stroke-width="3" stroke-dasharray="9 5"/>
  <text x="62" y="556" font-size="20" font-weight="700" fill="#9A3412">WHAT YOU SEE</text>
  <line x1="62" y1="572" x2="286" y2="572" stroke="#F3D5A7" stroke-width="2"/>
  <text x="62" y="606" font-size="20" font-weight="600" fill="#7C2D12">The reply, in chat</text>
  <text x="62" y="648" font-size="20" font-weight="600" fill="#7C2D12">Session summary</text>
  <text x="62" y="672" font-size="17" fill="#9A3412">updated each turn</text>
  <text x="62" y="712" font-size="20" font-weight="600" fill="#7C2D12">Download as .txt</text>

  <!-- Return arrows: clear of the payload box -->
  <path d="M 1430 344 L 1430 492 L 1120 492 L 1120 600 L 1086 600" fill="none" stroke="#B45309" stroke-width="4" marker-end="url(#arrowVar)"/>
  <line x1="636" y1="620" x2="604" y2="620" stroke="#B45309" stroke-width="4" marker-end="url(#arrowVar)"/>
  <line x1="344" y1="620" x2="312" y2="620" stroke="#B45309" stroke-width="4" marker-end="url(#arrowVar)"/>

  <!-- Loop: what you see becomes your next message -->
  <path d="M 174 516 L 174 476" fill="none" stroke="#78716C" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrowLoop)"/>
  <text x="40" y="786" font-size="17" font-style="italic" fill="#57534E">Your next message starts the loop again, one higher reply number.</text>

  <!-- Footer note -->
  <text x="40" y="884" font-size="18" fill="#1C1917"><tspan font-weight="700">The shape is fixed. The words are not.</tspan>  Counting the replies, choosing which instruction to attach, the JSON</text>
  <text x="40" y="910" font-size="18" fill="#1C1917">shape and the folding-in rules are plain code and never vary. Everything the model writes is new each time.</text>
  <text x="40" y="950" font-size="16" fill="#78716C">Mizmentor · React and Vite in the browser, Express or Vercel functions on the server, Google Gemini for the model</text>
</svg>
